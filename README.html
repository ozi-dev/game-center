<main><span class="tag">OYUN MERKEZİ · 2.0.0 · WINDOWS x64</span><h1>PC'deki oyunların, TV'de tek kütüphane.</h1><p>Steam, Epic, EA, Ubisoft, Xbox ve yerel emülatör oyunlarını Playnite'ta birleştirir; Sunshine ve Moonlight ile kumanda, klavye veya fare üzerinden kullanırsınız. Bu rehber kurulumdan hesap bağlantılarına, Shield ayarlarından ekran kurtarmaya kadar bağımsız kullanımı anlatır.</p>
<div class="card"><strong>Başlamak için:</strong> ZIP'in tamamını bir klasöre çıkarın, <code>Kurulum.exe</code> dosyasını açın. Yalnız EXE'yi kopyalamayın. Kurucu bileşenleri internetten indirir; yaklaşık 1–2 GB boş alan ve ayrıca oyunlarınız için disk alanı ayırın. Bu pakette oyun, hesap, kayıt, firmware veya anahtar bulunmaz.</div>
<nav><a href="#kurulum">Kurulum</a><a href="#hesaplar">Hesaplar</a><a href="#shield">Shield ve Moonlight</a><a href="#kontrol">Kontroller</a><a href="#emulatorler">Emülatörler</a><a href="#sureler">Süre ve kapak</a><a href="#ekran">Ekran / Hz</a><a href="#adb">ADB</a><a href="#fps">Oyuna özel FPS</a><a href="#sorunlar">Sorun çözme</a><a href="#geri-alma">Geri alma</a><a href="#gelistirici">Kaynaklar</a></nav>
<h2 id="gereksinimler">Gereksinimler</h2><p>Intel/AMD x64 Windows 10/11, PowerShell 5.1, .NET Framework 4.8 ve güncel GPU sürücüsü gerekir. ARM Windows, 32 bit Windows ve Linux için bu kurucu kullanılmaz. Sunshine'ın desteklediği donanım kodlayıcıya sahip NVIDIA, AMD veya Intel GPU kullanın. Sürücüde veya işletim sisteminde değişiklik gerekiyorsa tanıdan sonra resmi kurucuyu kullanın.</p>
<ul><li><a href="https://dotnet.microsoft.com/en-us/download/dotnet-framework/net48">Microsoft .NET Framework 4.8 Runtime</a> — eski Windows kurulumunda eksikse kurup PC'yi yeniden başlatın.</li><li><a href="https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist">Visual C++ 2015–2022/sonrası çalışma zamanı</a> — x64 ve x86 gerekir. WinGet varsa kurucu eksik olanları kurar; yoksa bu sayfadan ikisini indirin.</li><li><a href="https://apps.microsoft.com/detail/9nblggh4nns1">App Installer / WinGet</a> — mağaza başlatıcılarını otomatik kurmak için gerekir. Microsoft Store'dan kurun, kurucuyu kapatıp yeniden açın.</li><li>GPU sürücüleri: <a href="https://www.nvidia.com/Download/index.aspx">NVIDIA</a>, <a href="https://www.amd.com/en/support">AMD</a>, <a href="https://www.intel.com/content/www/us/en/download-center/home.html">Intel</a>. Kurucu GPU sürücünüzü değiştirmez.</li><li>PC ve Shield/TV aynı yerel ağda olsun. PC ile Shield için Ethernet tercih edin. Yalnız ev içi yayın için modemde port yönlendirme gerekmez.</li></ul>
<h2 id="kurulum">İlk kurulum: yedi adım</h2><ol><li><strong>Başlangıç ve tanı:</strong> otomatik denetimin bitmesini bekleyin. Mevcut Playnite ve Sunshine bulunursa gösterilir. Playnite kurulu değilse alanı boş bırakın. Varsayılan kurulum kişisel Windows uygulama klasörünüzdeki <code>OyunMerkezi</code> klasörüdür. Mevcut Playnite için EXE'nin bulunduğu klasörü seçin.</li><li><strong>Kitaplıklar ve giriş:</strong> kullandığınız mağazaları işaretleyin. Epic doğrudan indirme açıkken Legendary kullanılır; Epic istemcisini kurmak zorunlu değildir. EA/Ubisoft oyunlarını Epic'ten aldıysanız kendi hesaplarını da bağlayın.</li><li><strong>Emülatörler:</strong> mevcut emülatörlerinizi ve ROM klasörlerini ekleyin; aşağıdaki örnekleri izleyin. Emülatör kullanmıyorsanız boş bırakın.</li><li><strong>Yayın ve ekran:</strong> istemci türünü, çözünürlük/Hz ve bit hızını seçin. Shield için 4K60 ile başlayın. Masaüstü ve Oyun Kütüphanesi kutularını ayrı ayrı açıp kapatabilirsiniz. Diğer Sunshine uygulamalarını koruma seçeneği varsayılan açıktır.</li><li><strong>Kurulum ve bakım → Kur / eksikleri tamamla:</strong> önce Playnite ve oyunları kapatın. Kurucu seçili başlatıcıları, Playnite ve eklentileri indirir; eksik Sunshine, kumanda sürücüsü ve seçildiyse imzalı sanal ekran sürücüsünü kurar. Windows yönetici istemini dosya/ayar değişikliği için onaylayın. Yeniden başlatma istenirse TV testinden önce tamamlayın.</li><li><strong>Kitaplıklar → Hesapları bağlamak için Playnite'ı aç:</strong> mağaza hesaplarınızla aşağıdaki gibi giriş yapın. Sonra kitaplıkları güncelleyin.</li><li><strong>Shield / TV bağlantısı:</strong> Moonlight'ı açın ve PIN eşleştirmesini tamamlayın. Moonlight'ta <strong>Oyun Kütüphanesi - Playnite</strong> kutusu TV arayüzünü, <strong>Masaüstü - Desktop</strong> normal masaüstünü açar.</li></ol>
<p>Sonraki kullanımlarda Windows Başlat menüsündeki <strong>Oyun Merkezi</strong> klasöründen kütüphaneyi veya <strong>Oyun Merkezi Ayarları</strong> uygulamasını açın. İlk ZIP klasörünü artık taşımak/silmek kurulu uygulamayı etkilemez. Ayarları değiştirirken <strong>Ayarları kaydet</strong> ardından <strong>Kurulum ve bakım → Ayarları uygula / onar</strong> kullanın; Playnite ve yayın kapalı olsun. Mağaza seçimini kaldırmak gelecekteki içe aktarmayı kapatır; var olan oyun kayıtlarını ve oturumları silmez.</p>
<h2 id="hesaplar">Mağaza hesapları ve indirmeler</h2><p>Playnite masaüstü arayüzünde ana menü → <strong>Eklentiler (F9) → Uzantı Ayarları → Kütüphaneler</strong> yolunu açın. İlgili mağazayı seçip <strong>Hesabı bağla / Authenticate</strong> adımını tamamlayın, kurulu olmayan oyunları içe aktarma seçeneğinin açık olduğuna bakın. Hesap ayrıntıları uygulamada bulunur; şifre veya doğrulama kodunu başka birine göndermeniz gerekmez.</p>
<table><tr><th>Mağaza</th><th>Bir kere yapılacak işlem</th><th>TV'den kur seçildiğinde</th></tr><tr><td>Steam</td><td>Steam istemcisine ve Playnite Steam eklentisine giriş. Gizli profil için özel hesap seçeneği / kendi hesabınızla bağlantı. Steam Guard'ı tamamlayın.</td><td>Yalnız seçtiğiniz oyunun kurulum penceresi onaylanır. Steam arayüzü otomasyona kapalıysa Steam'i tamamen kapatıp <code>steam.exe -cef-force-accessibility</code> ile açın. Varsayılan kütüphane klasörünü Steam depolama ayarlarında belirleyin.</td></tr><tr><td>Epic</td><td>Doğrudan indirme açıkken <strong>Legendary (Epic Games)</strong> eklentisinde Authenticate. Tarayıcıdaki Epic girişini bitirin ve eklentinin istediği yetkilendirmeyi kendi penceresine aktarın.</td><td>Legendary + indirme yöneticisi indirir. Varsayılan hedef kurulum klasöründeki <code>Games\Epic</code>. İndirme/kurulum ayarları Legendary ve Unified Download Manager'ın kendi ekranında değiştirilebilir. EA/Ubisoft'a yönlenen ürünlerde kendi istemcisi gerekir.</td></tr><tr><td>EA / Ubisoft</td><td>İlgili istemciye giriş; Playnite eklentisinde de istenen hesap bağlantısını tamamlayın.</td><td>Resmi istemcinin kurulum akışı açılır. Gerekli onayları TV'de kumanda fare modu ya da bağlı fareyle verin. Bu hizmetler için sessiz kurulum garanti edilmez.</td></tr><tr><td>Xbox / Microsoft</td><td>İsteğe bağlıdır. Xbox uygulaması ve Microsoft hesabıyla giriş; istenirse Gaming Services'i Microsoft Store'dan kurun.</td><td>Xbox/Store kurulum akışı kullanılır; hesap, lisans ve Game Pass koşulları geçerlidir.</td></tr></table>
<p>Bağlantıdan sonra ana menü → <strong>Oyun kütüphanesini güncelle → Tümünü güncelle (F5)</strong>. TV'de <strong>Kurulu Oyunlar</strong> sekmesi oynanabilir oyunları gösterir; <strong>Tüm Kütüphane</strong> ve mağaza sekmeleri indirilmemiş oyunları da içerir. Hesaptaki ilk metadata/kapak indirmesi zaman alabilir. Mağazaların kendi oyun güncellemeleri ve ilk çalıştırma sözleşmeleri ayrı kalır.</p>
<h2 id="shield">NVIDIA Shield / Android TV bağlantısı</h2><ol><li>Shield Play Store'dan <a href="https://play.google.com/store/apps/details?id=com.limelight">Moonlight Game Streaming</a> kurun/açın. NVIDIA Games veya eski GameStream menüsü gerekmez.</li><li>PC'de <a href="https://localhost:47990">Sunshine web panelini</a> açın. İlk kullanımda kendi yönetici hesabınızı oluşturun. Yerel Sunshine'ın kendi sertifikası nedeniyle tarayıcı uyarısı çıkabilir; adresin kendi PC'nizdeki <code>https://localhost:47990</code> olduğuna bakın.</li><li>Moonlight'ta PC'yi seçin. Gösterdiği dört haneli PIN'i Sunshine panelinin <strong>PIN</strong> bölümüne girin. Zaten eşleşmiş cihazın yeniden eşleşmesi gerekmez. PC görünmezse tanı sayfasındaki IPv4 adresiyle Moonlight'ta bilgisayar ekleyin.</li><li>Moonlight ayarlarında çözünürlük/FPS ve bit hızını kurucuda seçtiğiniz değerlerle eşleştirin. Otomatik ekran ayarı için <strong>Optimize game settings / Oyun ayarlarını iyileştir</strong> açık olsun. İlk testte 1080p60 / 20 Mbps; Ethernet sorunsuzsa 4K60 / 50–80 Mbps deneyin.</li><li><strong>Oyun Kütüphanesi - Playnite</strong> kutusunu açın. Kumandayı Shield'a USB/Bluetooth ile eşleyin. Kütüphaneden çıkıp Moonlight'ta oturumu sonlandırdığınızda fiziksel PC monitörü geri gelmelidir.</li></ol>
<p><strong>Shield TV/Pro için 4K60 üst sınırdır.</strong> TV panelinin 120/144 Hz olması Shield'ın 4K120 çıkış verdiği anlamına gelmez. HDMI 2.0b çıkışı ve cihazın video çözme yeteneği birlikte sınır koyar. Daha yüksek FPS için Shield'ın gerçekten sunduğu düşük çözünürlüklü modu kullanın; bütün Shield modellerinde 1080p120 garanti değildir. Başka bir istemcide 120/144/165/240 Hz değerleri ancak cihaz, GPU, ağ ve HDMI/DP zinciri destekliyorsa kullanılır. <a href="https://www.nvidia.com/en-us/shield/shield-tv/">NVIDIA teknik özellikleri</a>.</p>
<h2 id="kontrol">Klavye, fare ve kumanda</h2><p><strong>Yayın ve ekran → Klavye ve fareyle menü/yayın kontrolü</strong> seçeneği hem Playnite imlecini hem Sunshine girişini açar. Kablosuz USB alıcısını Shield'a takın veya Bluetooth cihazları Shield ile eşleyin. Klavyede ok tuşları, Enter ve Esc; farede oyun kartına tıklama kullanılır. Emülatör içindeki tuşlar o emülatörün Input/Controls ayarlarından eşlenir; menü desteği her oyuna otomatik klavye tuş haritası oluşturmaz.</p>
<p>Kumandada <strong>Start düğmesine uzun basın</strong>: Moonlight fare modu açılır. Analog çubuk imleci hareket ettirir, A sol, B sağ tıklar. Aynı uzun basışla oyun moduna dönün. Kurulum onayları için PC başına gitmeden bu modu kullanabilirsiniz. <a href="https://github.com/moonlight-stream/moonlight-docs/wiki/Setup-Guide#keyboardmousegamepad-input-options">Moonlight kontrol rehberi</a>.</p>
<h2 id="emulatorler">Emülatör ve yerel oyun ekleme</h2><p><strong>Emülatörler → Emülatör ekle</strong> penceresinde görünür adı, EXE'yi, oyun klasörünü, platformu ve dosya uzantılarını seçin. Veri klasörü ROM klasörü değildir; emülatörün ayarlarını ve süre kayıtlarını tuttuğu klasördür. Aynı RetroArch EXE'si için her sistem/çekirdeğe ayrı satır ekleyebilirsiniz. Kaydettikten sonra ayarları uygulayın ve Playnite'ta kütüphaneleri yenileyin.</p>
<table><tr><th>Tür</th><th>Örnek başlatma komutu</th><th>Veri / çekirdek</th></tr><tr><td>Fritchii / Lichii / Yuzu türevi</td><td><code>-f -g "{ImagePath}"</code></td><td>Emülatörde File → Open Data/User Folder. Fritchii genellikle <code>%APPDATA%\fritchii</code>. Uzantılar <code>nup,nsp,xci</code>.</td></tr><tr><td>RetroArch</td><td><code>-f --appendconfig "{GameCenterDir}\assets\retroarch-tv.cfg" -L "{CorePath}" "{ImagePath}"</code></td><td>Veri: <code>retroarch.cfg</code> bulunan klasör. Çekirdek: <code>cores</code> içindeki uygun DLL.</td></tr><tr><td>Diğer</td><td>Kendi emülatörünüzün komutu; oyun yolu yerine <code>{ImagePath}</code>.</td><td>Playnite'tan başlatılan yeni oturumlar takip edilir. Eski süreleri her emülatörden aktarma desteği yoktur.</td></tr></table>
<p><strong>RetroArch eksikse</strong> kurucudaki kur düğmesini kullanın veya <a href="https://www.retroarch.com/?page=platforms">resmi Windows x64 dağıtımını</a> kurun. RetroArch → Main Menu → Online Updater → Core Downloader içinde sisteminize uygun çekirdeği indirin: NES için Mesen, Nintendo 64 için Mupen64Plus-Next, PS2 için LRPS2/PCSX2 mevcutsa. Çekirdek görünmüyorsa resmi dokümandaki platform sınırlamasını kontrol edin. PS2 gibi sistemler için kendi BIOS'unuzu RetroArch'ın <code>system</code> klasörüne yerleştirin. <a href="https://docs.libretro.com/guides/download-cores/">Çekirdek rehberi</a>.</p>
<p>Fritchii gibi özel forkların güvenilir sabit dağıtımı bulunmadığında kurucu internetten benzer adlı EXE aramaz; mevcut doğruladığınız emülatör EXE'sini seçin. Firmware, anahtar, BIOS ve oyun dosyalarını emülatörün kendi resmi yönergesine göre kendiniz sağlayın. Güncelleme/DLC dosyalarını oyun tarama klasöründen ayrı tutun. Normal PC oyununu Playnite masaüstünde <strong>Oyun ekle → Manuel ekle</strong> ile ekleyebilirsiniz. Emülatörü oyun merkezinden başlatmadan önce açık kopyasını kapatın; böylece süreç takibi doğru çalışır.</p>
<h2 id="sureler">Oynanma süresi ve kapaklar</h2><p>Fritchii/Lichii uyumlu <code>play_time\playtime.bin</code> kayıtları başlık kimliğine göre okunur. NUP içindeki gerçek kimlik kullanılır; dosya adının yanlış yazılmış olması süreyi başka oyuna bağlamaz. NSP/XCI için dosya adında <strong>tam 16 haneli başlık kimliği</strong> bulunmalı. Örnek <code>Oyun [0100F2C0115B6000].xci</code>. Kimlik yoksa gelişmiş eşleme aşağıdadır.</p>
<p>RetroArch'ta <code>playlists\logs</code> altındaki <code>.lrtl</code> çalışma günlükleri okunur; farklı bir <code>runtime_log_directory</code> seçiliyse o yol dikkate alınır. TV profili çalışma günlüğünü açar. Geçmişte günlük kapalıysa önceki süre sonradan hesaplanamaz. Ayarlarda ve ilgili emülatör satırında süre aktarımı açık olmalıdır.</p>
<p>Geçmişteki Playnite ve emülatör toplamlarından yüksek olan alınır. Sonraki aynı oturum iki kez sayılmaz; kaynak sıfırlansa da Playnite geçmişi düşürülmez. Açılışta, kütüphane yenilemesinde, oyun kapandığında ve 60 saniyede bir eşitlenir. Oyun çalışırken aktarma ertelenir; emülatörün diske yazması biraz sürebilir. İlk iki kaynağın geçmişinde birbirinden tamamen ayrı oturumlar varsa bunları tarih kaydı olmadan otomatik ayırmak mümkün değildir. Menü → Oyun Merkezi → Süreleri eşitle ile elle yenileyebilirsiniz.</p>
<p>Boş kapaklar için NUP'un içindeki uygun ikon kullanılır; <code>Oyun.cover.png</code> / <code>Oyun.cover.jpg</code> yan dosyası varsa alınır. Diğer oyunlarda Playnite'ın IGDB metadata indirmesini kullanın. Yan dosya için ROM <code>Oyun.xci</code> ise kapak <code>Oyun.cover.jpg</code> adını taşımalıdır. Mevcut kapaklar değiştirilmez.</p>
<h2 id="ekran">Sanal ekran, yüksek Hz ve monitör sinyali</h2><p>Yayın ayarları ayrı düğmelerdir: <strong>sanal ekran</strong>, <strong>fiziksel monitörleri kapatma</strong>, <strong>yayın sonrası geri getirme</strong>, <strong>otomatik çözünürlük/Hz</strong>, <strong>Desktop/Kütüphane kutuları</strong> ve <strong>diğer kutuları koruma</strong>. Monitörü kapatma, sanal ekran aktifken Windows'ta diğer ekranların sinyalini devre dışı bırakır; monitörünüzün elektrik düğmesini kontrol etmez.</p>
<p>Kurucu gerekirse imzalı Virtual Display Driver kurar ve 1080p60, 1440p60, 4K60 ile seçtiğiniz özel modu XML'e ekler. Başka sürücü veya farklı XML biçimi saptanırsa kendi sürücü yöneticinizden modu eklemeniz istenir. Mevcut VDD başka klasördeyse o klasörü gösterin. Yeni eklenen Hz Windows'ta görünmezse önce yayını kapatıp PC'yi yeniden başlatın; ardından kurucuda Tanı'yı yenileyin, sanal ekranı seçip tekrar uygulayın. Sürücü kurulumu bazı PC'lerde yeniden başlatma gerektirir.</p>
<p>Otomatik seçim açıksa Sunshine Moonlight'ın istediği çözünürlük/Hz değerini uygular; yalnız kurucudaki sayıyı değiştirmek istemci FPS'sini değiştirmez. Otomatik seçim kapalıysa PC için girilen değerler sabitlenir. Bit hızı ve HDR tercihi ayrıca Moonlight'ta seçilir. HDR için ekran/sürücü, kodlayıcı ve istemcinin HDR desteği gerekir; ilk kurulumu SDR ile doğrulayın. <a href="https://docs.lizardbyte.dev/projects/sunshine/latest/md_docs_2configuration.html#dd_configuration_option">Sunshine ekran ayarları</a>.</p>
<h2 id="adb">İsteğe bağlı ADB</h2><p>Yayın ve hesap bağlantıları ADB'siz çalışır. ADB yalnız Shield modlarını okuma veya Play Store yerine Moonlight APK'sını kurma kolaylığı içindir. Kurucu Google Platform Tools ve Moonlight'ın resmi APK'sını gerektiğinde indirip SHA-256 doğrular.</p><ol><li>Shield Ayarlar → Cihaz Tercihleri → Hakkında → Derleme üzerine yedi kez basın.</li><li>Geliştirici seçeneklerinde <strong>Ağ hata ayıklama</strong> seçeneğini açın; bazı modellerde önce USB hata ayıklama açılır. Shield'ın Ayarlar → Ağ menüsündeki IPv4 adresini kurucuya yazın.</li><li><strong>ADB ile bağlan ve modları oku</strong> seçin; Shield ekranındaki RSA bilgisayar iznini onaylayın. Yetkisiz görünüyorsa TV'deki izni tamamlayıp tekrar basın. Port 5555 kapalıysa ağ hata ayıklamanın açık ve cihazların aynı ağda olduğunu kontrol edin.</li><li>Moonlight kurulu değilse <strong>Moonlight'ı cihaza kur / aç</strong> kullanın. Zaten kurulu uygulama düşürülmez veya üzerine yazılmaz. Play Store sürümü de uygundur.</li><li>İşiniz bitince cihazın ağ hata ayıklamasını kapatabilirsiniz.</li></ol>
<p>Android 11+ cihaz yalnız <strong>Kablosuz hata ayıklama → Eşleştirme koduyla eşleştir</strong> sunuyorsa port 5555 yolu çalışmaz. Bu durumda Play Store yolunu kullanın; ADB zorunlu değildir. Gelişmiş kullanımda indirilen <code>data\tools\adb\platform-tools</code> klasöründe Terminal açıp cihazın gösterdiği adreslerle <code>.\adb pair IP:ESLESTIRME_PORTU</code>, ardından <code>.\adb connect IP:BAGLANTI_PORTU</code> çalıştırın; kodu yalnız yerel terminale girin. Bu değişken port yöntemi kurucunun 5555 düğmeleri tarafından yönetilmez. <a href="https://developer.android.com/tools/adb#connect-to-a-device-over-wi-fi">Google ADB yönergesi</a>.</p>
<h2 id="fps">Oyuna özel FPS profilleri</h2><p>TOTK için 60/90 düğmeleri, <strong>zaten kurulu ve sürümü uyumlu</strong> Dynamic FPS 1.5.5 tabanlı profil içindir. Mod yoksa oyun hızı değiştirilmez. Mod kurulumu, oyun sürümü ve emülatör uyumu ayrı kontrol edilmelidir; sabit 60/90 FPS her donanım ve sahnede garanti değildir. <a href="https://github.com/hoverbike1/TOTK-Mods-collection/releases/tag/v2.6">Dynamic FPS geliştirici kaynağı</a>.</p>
<p>Bu pakette oyun modu/NPDM dağıtılmaz. Emülatörün kendi mod yöneticisinden, kendi oyun sürümünüzle uyumlu modu kurun. Tanımlı veri klasöründe <code>load\0100F2C0115B6000</code> altında adı DynamicFPS/dFPS ve 1.5.5 içeren, <code>romfs\dfps</code> dizinine sahip tek mod bulunmalıdır. Mevcut tek zzz*.ini profili kullanılır; yoksa ayrı bir yerel FPS profili oluşturulur. Başka mod/sürüm düzeninde emülatör veya modun kendi FPS ayarını kullanın. Mod ve oyun başına INI değişiklikleri önce yedeklenir; emülatör açıkken uygulanmaz.</p>
<h2 id="sorunlar">Sorun çözme</h2><table><tr><th>Belirti</th><th>İzlenecek yol</th></tr><tr><td>Moonlight PC'yi bulamıyor</td><td>PC açık/uyanık ve Sunshine hizmeti çalışıyor mu? İki cihaz aynı ağda mı? Windows ağ profilini ev ağınızda Özel yapın; Sunshine'ın Windows Güvenlik Duvarı iznini kontrol edin. PC IPv4 adresiyle elle ekleyin. Kurulum ekranındaki tanıyı yenileyin.</td></tr><tr><td>Yalnız Desktop / eski kutular görünüyor</td><td>Her iki kutunun ayarını açıp Playnite ve yayın kapalıyken Uygula yapın. Moonlight PC ekranını yeniden açıp listeyi yenileyin. İstemiyorsanız Diğer Sunshine kutularını koru seçeneğini kapatın.</td></tr><tr><td>Siyah ekran / monitör geri gelmiyor</td><td>Yayını sonlandırın. PC'de <strong>Ctrl+Alt+F11</strong> veya Başlat → Oyun Merkezi → Ekranı Geri Getir kullanın. Olmazsa Win+P ile Genişlet/Yalnız PC ekranı seçin ve Windows Ekran Ayarları'ndan fiziksel ekranı etkinleştirin. Sonra Tanı'da doğru sanal ekranı seçin.</td></tr><tr><td>Kumanda menüde veya oyunda çalışmıyor</td><td>Kumanda Shield'a bağlı, kurucuda Kumanda açık ve ViGEmBus tanıda bulundu mu? Yeni sürücü sonrası PC'yi yeniden başlatın. Oyunda emülatör Input/Controls ayarından XInput aygıtını eşleyin. Fare modunu Start uzun basışıyla kapatın.</td></tr><tr><td>Playnite Startup Error / güvenli mod</td><td>Önce Evet ile güvenli modda açın; üçüncü taraf tema/eklenti hatasını Playnite günlüğünden kontrol edin. Varsayılan temayla deneyin; sonra kapatıp kurucudan Onar çalıştırın. Bütün kütüphaneyi silmeyin. Ürün varsayılan Playnite temasını kullanır.</td></tr><tr><td>Steam onayı hâlâ bekliyor</td><td>Steam'i sistem tepsisinden tamamen kapatın. Kısayol hedefindeki EXE'den sonra <code>-cef-force-accessibility</code> ekleyerek açın. Depolama hedefini seçin. Yeni Steam arayüzü yardımcıya uymuyorsa seçilen oyunun onayını TV'den fare moduyla verin; yardımcı başka pencereye körlemesine tıklamaz.</td></tr><tr><td>Epic listesi / giriş boş</td><td>Doğrudan indirme açıkken Epic Store yerine Legendary eklentisini bağlayın; F5 ile yenileyin. Süresi dolan oturumu tekrar doğrulayın. EA/Ubisoft bağlantılı oyun için ilgili mağazayı da açın.</td></tr><tr><td>Paket indirilemiyor / özet uyuşmuyor</td><td>İnternet ve resmi GitHub/Playnite/Google erişimini kontrol edin. SHA-256 hatalı dosya çalıştırılmaz. Kaynak sürümü kaldırıldıysa resmi uygulamayı elle kurup kurucuya klasörünü gösterin; sürüm manifesti güncelleme işlemi Kaynaklar bölümündedir. Rastgele dosya indirip özet kontrolünü kapatmayın.</td></tr><tr><td>Windows uygulamayı tanımıyor</td><td>Oyun Merkezi özel kod imzalama sertifikasına sahip değildir; güvenilir göndericiden aldığınız paketin SHA-256 değerini kontrol edin veya kaynaklardan derleyin. Windows korumalarını kapatmak gerekmez. Yönetilen bilgisayarda kurum yöneticisinin uygulama onayı gerekebilir.</td></tr></table>
<h2 id="geri-alma">Yedek, kurtarma ve kaldırma</h2><p>Kurucunun değiştirdiği mevcut JSON/CONF/XML/oyun profilleri <code>data\backups</code> altında saklanır. Başlangıçtaki Playnite veritabanları varsa <code>data\backups\playnite-before-setup</code> klasörüne kopyalanır. <strong>Yardım → Yedeklenen ayarları geri al</strong> kullanmadan önce Playnite ve yayını kapatın. Tüm yedeklerin özeti ve değişmiş dosyalar kontrol edilir; sonraki kişisel değişiklikleriniz varsa otomatik üzerine yazılmaz. Gerekirse eski dosyayı yedek klasöründen inceleyerek elle birleştirin. Veritabanı geçmişi otomatik geriye sarılmaz; yeni oynanma/kayıtlarınız korunur.</p>
<p>Geri alma sürücüleri/programları kaldırmaz, yeni oluşturulan kütüphaneyi silmez. Tam kaldırmak için Playnite'ta Oyun Merkezi Companion ve Library Setup eklentilerini devre dışı bırakın; Sunshine uygulama/ekran ayarlarını yedekten geri alın. Sonra istemediğiniz programları Windows Yüklü Uygulamalar'dan kaldırın. Sanal ekranı kaldıracaksanız önce fiziksel ekrana dönün; Aygıt Yöneticisi → Görüntü bağdaştırıcıları → ilgili VDD'yi kaldırın. Mevcut başka yazılımın kullandığı sürücüyü kaldırmayın. Oyun Merkezi'nin kurduğu VDD bilgisi <code>data\installed-driver.json</code> dosyasında tutulur. Başlat menüsündeki kendi kısayollarını ve artık gerekmeyen kurulum klasörünü en son kaldırın; <code>Games\Epic</code> içindeki oyunları saklamak istiyorsanız önce taşıyın.</p>
<p><strong>Kimlik bilgisi içermeyen tanı raporu</strong> düğmesi sürüm, GPU, özellik ve seçilen görüntü modunu raporlar; hesap, IP, bilgisayar adı veya ROM yollarını dışarı aktarmaz. Yerel Playnite/kurulum günlükleri kişisel yol veya oyun adı içerebilir; bunları herkese açık paylaşmadan önce inceleyin. Uygulama telemetri göndermez; indirmeler ve hesap bağlantıları kendi sağlayıcılarıyla iletişim kurar.</p>
<h2 id="gelistirici">Gelişmiş ayarlar ve açık kaynak</h2><p>Ayarlar kurulu klasörde <code>data\settings.json</code> dosyasındadır. GUI bütün temel seçenekleri sunar. Başlık kimliğini dosya adından çıkaramadığınız bir ROM için ilgili emülatör satırının <code>TitleMappings</code> alanına tam ROM yolu → 16 haneli gerçek başlık kimliği ekleyebilirsiniz; düzenlemeden önce uygulamayı kapatıp dosyayı yedekleyin.</p><pre>"TitleMappings": {
  "D:\\Oyunlar\\ornek.xci": "0100F2C0115B6000"
}</pre><p>Kaynak kod, testler, derleme betiği ve sabitlenmiş bileşen listesi paketin <code>source</code> klasöründedir. Derleme için .NET Framework C# derleyicisi ve temiz Playnite dağıtımındaki SDK DLL'si yeterlidir:</p><pre>powershell -NoProfile -ExecutionPolicy Bypass -File .\Build.ps1 -PlayniteSdkPath "D:\Playnite\Playnite.SDK.dll"
powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\BackendTests.ps1</pre><p><code>manifests\packages.json</code> sürüm/URL/SHA-256 değerlerini sabitler. Sürüm yükseltirken resmi geliştirici kaynağını ve yeni özeti doğrulayın; <code>scripts\PrepareManifests.py</code> mevcut sabitlenmiş dosyaları indirip doğrular, özetleri otomatik değiştirmez. <code>CoreOnly -NoShortcuts</code> yalnız gelişmiş/test amaçlı Playnite katmanını kurar; Sunshine ve sürücülere dokunmaz.</p>
