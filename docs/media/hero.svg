<g font-family="Segoe UI,Arial,sans-serif"><rect x="64" y="54" width="316" height="30" rx="15" fill="#213e56"/><text x="82" y="75" font-size="13" letter-spacing="2" fill="#92deff">OPEN SOURCE · WINDOWS · COUCH PLAY</text>
<text x="60" y="166" font-size="70" font-weight="700" fill="white">Game Center</text><text x="64" y="206" font-size="25" fill="#99b1cc">Oyun Merkezi</text>
<text x="64" y="280" font-size="30" fill="#e3edf9">Your library. Your screen. Your couch.</text><text x="64" y="321" font-size="19" fill="#9fb1ca">Bring your PC games and emulators into Playnite.</text><text x="64" y="350" font-size="19" fill="#9fb1ca">Stream with Sunshine + Moonlight.</text>
<rect x="64" y="407" width="165" height="42" rx="21" fill="url(#accent)"/><text x="87" y="435" font-size="16" font-weight="700" fill="#0b172c">Made by ozi-dev</text>
<text x="249" y="434" font-size="15" fill="#91a8c0">Built on a great open-source ecosystem.</text>
