<title id="title">Game Center · Oyun Merkezi</title><desc id="desc">An open source setup companion for a unified Playnite library and Sunshine/Moonlight streaming.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#070c16"/></linearGradient><linearGradient id="accent"><stop stop-color="#74dcff"/><stop offset="1" stop-color="#89a5ff"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#6584a5" opacity=".13"/></pattern></defs>
